buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Keep native dependencies on the explicitly installed Build Tools version.
subprojects { child ->
    child.plugins.withId("com.android.library") {
        child.extensions.getByName("androidComponents").finalizeDsl { androidDsl ->
            androidDsl.buildToolsVersion = rootProject.ext.buildToolsVersion
            androidDsl.compileSdkVersion = rootProject.ext.compileSdkVersion
        }
    }
}
